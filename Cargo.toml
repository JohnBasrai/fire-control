[package]
name = "fire-control"
version = "0.1.0"
edition = "2021"
authors = ["John Basrai <John@Basrai.dev>"]
description = "Satellite propulsion firing controller using Tokio + async TCP."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JohnBasrai/fire-control"  # Optional

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }  # For #[tokio::test]
